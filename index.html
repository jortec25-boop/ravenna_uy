<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenna_uy - Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Ravenna_uy&quot;,&quot;short_name&quot;:&quot;Ravenna&quot;,&quot;display&quot;:&quot;standalone&quot;}">
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
        <h1 class="text-3xl font-bold mb-6 text-center text-indigo-600">Ravenna_uy</h1>
        
        <div id="mensaje-estado" class="text-center text-gray-500 mb-4">Cargando base de datos...</div>
        
        <!-- Lista de Productos -->
        <div id="app-content"></div>
    </div>

    <script>
        // Tus credenciales de Supabase
        const supabaseUrl = 'https://vnpznvhcrsiktznvvjbl.supabase.co';
        const supabaseKey = 'Sb_secret_dZM6L9QZgpe-3Ui7llpFhw_HhLw7tqW'; // Si no funciona, cambiar por la que empieza con eyJ...
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function cargarInventario() {
            const container = document.getElementById('app-content');
            const mensaje = document.getElementById('mensaje-estado');
            
            // Buscar productos en la nube
            const { data, error } = await supabase.from('productos').select('*').order('id');
            
            if (error) {
                mensaje.innerHTML = `<span class="text-red-500 font-bold">Error: Verifica que la clave API ingresada sea la correcta (anon public).</span>`;
                console.error(error);
                return;
            }

            if(data.length === 0) {
                mensaje.innerHTML = `No hay prendas registradas. Debes agregarlas desde tu panel de Supabase.`;
                return;
            }

            mensaje.innerHTML = ''; // Borrar mensaje de carga
            let html = '<ul class="divide-y divide-gray-200">';
            
            data.forEach(prenda => {
                // Lógica que pediste: si el stock es <= 2, se pone en rojo
                const alertaStock = prenda.stock <= 2 ? 'text-red-600 font-bold' : 'text-gray-600';
                
                html += `
                <li class="py-4 flex justify-between items-center">
                    <div>
                        <p class="text-lg font-bold text-gray-900">${prenda.descripcion} <span class="text-sm font-normal text-gray-500">(${prenda.talle})</span></p>
                        <p class="${alertaStock}">Stock disponible: ${prenda.stock}</p>
                        <p class="text-green-600 font-medium">$${prenda.precio_venta}</p>
                    </div>
                    <button onclick="vender(${prenda.id}, ${prenda.stock})" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-indigo-700">
                        Vender
                    </button>
                </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        // Función que resta el stock al vender (Movimiento de caja)
        async function vender(id_producto, stockActual) {
            if(stockActual <= 0) {
                alert('No queda stock de esta prenda.');
                return;
            }
            
            // Restar 1 al stock en la base de datos
            const { error } = await supabase
                .from('productos')
                .update({ stock: stockActual - 1 })
                .eq('id', id_producto);
                
            if(!error) {
                cargarInventario(); // Recargar la lista automáticamente
            } else {
                alert('Hubo un error al registrar la venta.');
            }
        }

        // Iniciar la app
        cargarInventario();
    </script>
</body>
</html>
